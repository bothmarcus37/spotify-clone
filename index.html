<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clon de Spotify · Buscador de música</title>
    <meta name="description" content="Buscador de música con la API de iTunes: portadas, álbumes y fragmentos de audio.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <aside class="sidebar">
        <p class="marca">Clon de Spotify</p>
        <nav class="menu" aria-label="Secciones">
            <button type="button" class="menu-item activo" data-vista="inicio">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"/></svg>
                <span>Inicio</span>
            </button>
            <button type="button" class="menu-item" data-vista="buscar">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 3a7.5 7.5 0 0 1 5.9 12.1l4.3 4.3-1.4 1.4-4.3-4.3A7.5 7.5 0 1 1 10.5 3zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11z"/></svg>
                <span>Buscar</span>
            </button>
            <button type="button" class="menu-item" data-vista="biblioteca">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 2.9 4.5 6.6 4.5c2 0 3.6 1 5.4 3 1.8-2 3.4-3 5.4-3 3.7 0 5.7 3.9 4.2 7.3C19.5 16.4 12 21 12 21z"/></svg>
                <span>Biblioteca</span>
                <span class="contador" id="contadorBiblioteca" hidden>0</span>
            </button>
        </nav>
        <p class="creditos">Proyecto académico sin relación con Spotify. Música y fragmentos de audio: iTunes Search API.</p>
    </aside>

    <main class="main-content" id="principal">
        <header class="cabecera">
            <h1 id="tituloVista">Explora música</h1>
            <form class="search-box" id="searchForm" role="search">
                <input type="search" id="searchInput" placeholder="Artista, canción o álbum" aria-label="Buscar música" autocomplete="off">
                <button type="submit" id="searchBtn">Buscar</button>
            </form>
        </header>

        <div class="sugerencias" id="sugerencias" aria-label="Búsquedas sugeridas"></div>

        <section aria-live="polite">
            <h2 class="subtitulo" id="subtitulo">Resultados</h2>
            <p class="estado" id="estado" hidden></p>
            <div id="songsContainer" class="songs-container"></div>
        </section>
    </main>

    <!-- Reproductor: un solo <audio> para toda la página -->
    <footer class="reproductor" id="reproductor" hidden>
        <div class="rep-info">
            <img id="repPortada" src="" alt="">
            <div class="rep-textos">
                <p id="repTitulo"></p>
                <p id="repArtista"></p>
            </div>
        </div>
        <div class="rep-controles">
            <button type="button" id="repPlay" class="rep-play" aria-label="Pausar">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path id="repIcono" d="M7 5h4v14H7zm6 0h4v14h-4z"/></svg>
            </button>
            <span class="rep-tiempo" id="repActual">0:00</span>
            <input type="range" id="repBarra" min="0" max="100" value="0" step="0.1" aria-label="Avance del fragmento">
            <span class="rep-tiempo" id="repTotal">0:30</span>
        </div>
        <p class="rep-nota">Fragmento de 30 s</p>
        <audio id="audio" preload="none"></audio>
    </footer>

    <script src="script.js"></script>
</body>
</html>
